<script>
function toggleTheme(){
  var html=document.documentElement;
  var cur=html.getAttribute("data-theme")==="dark"?"dark":"light";
  var next=cur==="dark"?"light":"dark";
  html.setAttribute("data-theme",next);
  var btn=document.querySelector(".theme-toggle");
  if(btn) btn.textContent = next==="dark"?"☀️":"🌙";
}
function tkey(){
  // 正確密鑰是怎麼來的？這裡讀的是 COURSE_PROGRESS.teacherKeyEnc，
  // 追追看那個變數是誰給的、又是從哪個檔案來的 :)
  try{
    return (window.COURSE_PROGRESS && COURSE_PROGRESS.teacherKeyEnc) ? atob(COURSE_PROGRESS.teacherKeyEnc) : "";
  }catch(e){ return ""; }
}
function param(n){ var m=new RegExp("[?&]"+n+"=([^&#]*)").exec(location.search); return m?decodeURIComponent(m[1]):null; }
function enter(){ location.href="video-library.html"; }
function tryEnter(){
  var v=(document.getElementById("pw").value||"").trim();
  // 這個比對是在「你的瀏覽器」裡做的（前端）——這正是它擋不住高手的地方。
  if(v && v===tkey()){ enter(); }
  else{ document.getElementById("err").textContent="✗ 密鑰錯誤，請再試一次。"; }
}
document.addEventListener("DOMContentLoaded", function(){
  var i=document.getElementById("pw");
  i.focus();
  i.addEventListener("keydown", function(e){ if(e.key==="Enter") tryEnter(); });
});
(function(){
  // 存密鑰的那個檔案不再用明文的 <script src> 直接寫在原始碼裡，
  // 路徑本身也包了一層 Base64——想找到它，得先解開上面藏起來的提示。
  var s = document.createElement("script");
  s.src = atob("c2Vzc2lvbi5qcw==");
  s.onload = function(){
    // 網址已帶正確 key 就直接放行
    if(tkey() && param("key")===tkey()){ enter(); }
  };
  document.head.appendChild(s);
})();
</script>
